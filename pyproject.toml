[project]
name = "valuationengine"
version = "0.1.0"
description = "DCF, LBO, and reverse DCF toolkit"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "click==8.5.0",
    "matplotlib==3.11.2",
    "numpy==2.5.3",
    "pandas==3.0.6",
    "scipy==1.18.1",
    "yfinance==1.7.0",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
]

[project.scripts]
ve = "valuationengine.adapters.cli:cli"

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["valuationengine*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
